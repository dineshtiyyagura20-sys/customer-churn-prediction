services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-churn-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: customer-churn-frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped